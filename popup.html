<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      width: 260px;
      padding: 14px;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 6px;
    }
    p {
      font-size: 12.5px;
      color: #555;
      line-height: 1.4;
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid #eee;
    }
    .row-label {
      font-size: 13px;
      font-weight: 600;
    }
    /* toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      transition: 0.2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2563eb;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .status.on { color: #1a7f37; }
    .status.off { color: #888; }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>Copy-Paste Unlock</h1>
  <p>Re-enables copy, cut, paste, right-click, and text selection on pages that block them.</p>

  <div class="row">
    <span class="row-label">Enabled</span>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="status off" id="status">○ Disabled</div>
  <div class="hint">Toggling reloads the current tab so the change takes effect.</div>

  <script src="popup.js"></script>
</body>
</html>
